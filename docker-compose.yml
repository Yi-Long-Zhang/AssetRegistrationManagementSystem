services:
  backend:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: :8080
      DATABASE_PATH: /app/data/assets.db
      ATTACHMENT_DIR: /app/data/attachments
      JWT_SECRET: change-me-in-production
      AUTH_MODE: mixed
      CONFIG_ENCRYPTION_KEY: change-me-config-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
      ALLOWED_ORIGINS: "*"
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  backend-data:
