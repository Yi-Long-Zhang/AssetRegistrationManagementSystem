info:
  contact: {}
  description: 企业内部服务器资产台账与工单流程管理系统 REST API。
  title: Asset Registration Management System API
  version: "1.0"
paths:
  /ad/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: AD 配置详情
      tags:
      - settings
    put:
      consumes:
      - application/json
      parameters:
      - description: AD 配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.adConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.errorResponse'
      security:
      - BearerAuth: []
      summary: 保存 AD 配置
      tags:
      - settings
  /ad/import-user:
    post:
      consumes:
      - application/json
      parameters:
      - description: 导入参数
        in: body
        name: body
        required: true
