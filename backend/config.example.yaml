app:
  env: development

http:
  addr: :8080

storage:
  database_path: data/assets.db
  attachment_dir: data/attachments
  ticket_archive_dir: data/ticket-archives
  ticket_template_path: ../templates/ticket-it-change-template.docx
  libreoffice_bin: soffice

security:
  jwt_secret: change-me-in-production
  config_encryption_key: change-me-config-key

auth:
  mode: mixed

swagger:
  enabled: true

admin:
  username: admin
  password: admin123456

cors:
  allowed_origins: "*"

discovery:
  # 资产自动发现（nmap）配置；nmap_bin 留空时自动探测 tools/nmap/<platform>/ 与系统 PATH
  nmap_bin: ""
  scan_timeout_sec: 300
  default_ports: "22,80,443,3389"
  probe_ports: "22,80,443,445,3389"  # 两阶段扫描探活端口
  max_parallel_scans: 4              # 大网段分片并行扫描最大并发
  scan_chunk_size: 128               # 单次扫描主机数上限（分片粒度）
  max_hosts: 1024
  min_rate: 0          # nmap --min-rate（每秒发包下限），0=不限制
  max_rate: 0          # nmap --max-rate（每秒发包上限），0=不限制
  alert_emails: ""     # 变更告警收件人（逗号分隔），空=不发送
  offline_after_hours: 24
